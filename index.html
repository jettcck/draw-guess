<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>你画我猜 - Draw & Guess</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== 屏幕 1：首页 ==================== -->
  <div id="screen-home" class="screen active">
    <div class="home-bg">
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
    </div>

    <div class="home-container">
      <div class="logo">🎨</div>
      <h1 class="home-title">你画我猜</h1>
      <p class="home-subtitle">和朋友一起画画猜词，乐趣无限！</p>

      <div class="card">
        <div class="input-group">
          <label>🎭 你的昵称</label>
          <input type="text" id="input-name" placeholder="输入昵称（最多10个字）" maxlength="10" autocomplete="off">
        </div>

        <button class="btn btn-primary" id="btn-create">
          ✨ 创建新房间
        </button>

        <div class="divider"><span>或者</span></div>

        <div class="input-group">
          <label>🔑 房间码</label>
          <input type="text" id="input-code" placeholder="输入6位房间码" maxlength="6" autocomplete="off" style="text-transform: uppercase; letter-spacing: 4px; text-align: center; font-size: 20px; font-weight: 700;">
        </div>

        <button class="btn btn-secondary" id="btn-join">
          🚪 加入房间
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 屏幕 2：等待大厅 ==================== -->
  <div id="screen-lobby" class="screen">
    <div class="home-container">
      <div class="logo">⏳</div>
      <h1 class="home-title">等待玩家加入</h1>

      <div class="card" style="margin-top: 20px;">
        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 4px;">房间码</p>
        <p style="font-size: 36px; font-weight: 800; letter-spacing: 6px; color: var(--secondary); margin-bottom: 20px;" id="lobby-code">------</p>

        <h3 style="font-size: 13px; color: var(--text-muted); text-align: left; margin-bottom: 8px;">👥 玩家列表</h3>
        <ul class="lobby-players" id="lobby-players">
          <li class="lobby-player" style="color: var(--text-muted);">等待玩家加入...</li>
        </ul>

        <button class="btn btn-primary" id="btn-start" style="margin-top: 16px;" disabled>
          🎮 开始游戏（至少2人）
        </button>
        <button class="btn btn-danger" id="btn-exit-lobby" style="margin-top: 8px; width: 100%;">🚪 退出房间</button>
      </div>
    </div>
  </div>

  <!-- ==================== 屏幕 3：游戏中 ==================== -->
  <div id="screen-game" class="screen">
    <!-- 顶部信息栏 -->
    <div class="game-header">
      <div class="room-code">房间 <strong id="game-code">------</strong></div>
      <div class="round-info" id="game-round">第 1/3 轮</div>
      <div class="word-display hidden" id="game-word">????</div>
      <div class="timer" id="game-timer">60</div>
      <button class="btn btn-sm btn-icon" id="btn-exit-game" title="退出房间" style="background: var(--danger); min-width: 36px;">🚪</button>
    </div>

    <!-- 画布 -->
    <div class="canvas-area" id="canvas-area">
      <canvas id="draw-canvas"></canvas>
      <div class="canvas-placeholder" id="canvas-placeholder">等待绘画者开始作画...</div>
    </div>

    <!-- 工具栏（仅绘画者可见） -->
    <div class="toolbar" id="toolbar" style="display: none;">
      <div class="toolbar-group" id="colors-group">
        <!-- JS 动态生成 -->
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group" id="sizes-group">
        <!-- JS 动态生成 -->
      </div>
      <div class="toolbar-divider"></div>
      <button class="btn btn-sm btn-icon" id="btn-eraser" title="橡皮擦">🧹</button>
      <button class="btn btn-sm btn-icon" id="btn-clear" title="清空画布">🗑️</button>
    </div>

    <!-- 侧边栏 -->
    <div class="sidebar">
      <div class="player-panel" id="game-player-panel">
        <h3>👥 玩家</h3>
        <div id="game-players"></div>
      </div>

      <div class="chat-panel">
        <div class="chat-messages" id="chat-messages">
          <div class="chat-msg system">💡 在底部输入你的猜测</div>
        </div>
        <div class="chat-input-area" id="chat-input-area">
          <input type="text" id="chat-input" placeholder="输入你的猜测..." maxlength="50" autocomplete="off">
          <button id="btn-send">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 弹窗：游戏结束 ==================== -->
  <div class="modal-overlay" id="modal-gameover">
    <div class="modal">
      <h2>🏆 游戏结束！</h2>
      <ul class="rank-list" id="rank-list"></ul>
      <p id="winner-text"></p>
      <button class="btn btn-primary" id="btn-stay-room" style="margin-bottom: 8px;">🔄 再来一局</button>
      <button class="btn btn-secondary" id="btn-back-home">🏠 返回首页</button>
    </div>
  </div>

  <!-- ==================== 弹窗：输入题目（绘画者） ==================== -->
  <div class="modal-overlay" id="modal-word-input">
    <div class="modal">
      <h2>🎯 输入你要画的题目</h2>
      <p>其他玩家会看到字数提示，但看不到题目</p>
      <div class="input-group" style="margin-bottom: 16px;">
        <input type="text" id="input-word" placeholder="输入题目（最多10个字）" maxlength="10" autocomplete="off" style="text-align: center; font-size: 20px;">
      </div>
      <button class="btn btn-primary" id="btn-submit-word">✅ 确认并开始画画</button>
    </div>
  </div>

  <!-- Supabase JS SDK -->
  <!-- Supabase JS SDK（本地加载，无需 CDN） -->
  <script src="js/supabase-sdk.js"></script>

  <!-- 游戏脚本（按依赖顺序加载） -->
  <script src="js/config.js"></script>
  <script src="js/game.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/room.js"></script>
  <script src="js/home.js"></script>

</body>
</html>
